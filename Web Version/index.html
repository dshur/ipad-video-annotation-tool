<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Editing Notes</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Video Editing Notes</h1>
            <div class="file-controls">
                <label for="video-file" class="file-label">Load Video</label>
                <input type="file" id="video-file" accept="video/*">
                <span id="video-name" class="video-name">No video loaded</span>
            </div>
        </header>

        <main>
            <section class="video-section">
                <div class="video-container">
                    <video id="video-player">
                        <p>Your browser doesn't support HTML5 video.</p>
                    </video>
                </div>
                <div class="scrubber-container">
                    <input type="range" id="scrubber" class="scrubber" min="0" max="100" value="0" step="0.1">
                    <div class="scrubber-progress" id="scrubber-progress"></div>
                </div>
                <div class="video-controls">
                    <div class="time-display">
                        <input type="text" id="current-time" class="time-input" value="0:00" title="Click to edit timestamp"> / <span id="duration">0:00</span>
                    </div>
                    <div class="speed-controls">
                        <button id="speed-down" class="speed-btn" title="Decrease speed [">−</button>
                        <button id="speed-1x" class="speed-preset-btn" title="Set to 1x">1x</button>
                        <span id="speed-display" class="speed-display">1x</span>
                        <button id="speed-2x" class="speed-preset-btn" title="Set to 2x">2x</button>
                        <button id="speed-up" class="speed-btn" title="Increase speed ]">+</button>
                    </div>
                    <div class="playback-controls">
                        <button id="play-pause" class="control-btn" title="Play/Pause (Space)">▶</button>
                    </div>
                </div>
                <div class="shortcuts-help">
                    <strong>Shortcuts:</strong>
                    <span>Space: Play/Pause</span>
                    <span>[ / ]: Speed −/+</span>
                    <span>← / →: Skip 5s</span>
                    <span>Enter: Save note</span>
                    <span>Esc: Cancel note</span>
                </div>
            </section>

            <section class="notes-section">
                <div class="note-input-container">
                    <div class="note-input-header">
                        <div class="note-timestamp" id="note-timestamp">--:--</div>
                        <label class="toggle-container" title="Auto-pause video when typing">
                            <input type="checkbox" id="auto-pause-toggle" checked>
                            <span class="toggle-slider"></span>
                            <span class="toggle-label">Auto-pause</span>
                        </label>
                    </div>
                    <textarea
                        id="note-input"
                        placeholder="Start typing to capture timestamp..."
                        rows="3"
                    ></textarea>
                    <button id="save-note" class="save-btn">Save Note (Enter)</button>
                </div>

                <div class="notes-header">
                    <h2>Notes</h2>
                    <div class="export-controls">
                        <button id="export-json" class="export-btn">Export JSON</button>
                        <button id="export-csv" class="export-btn">Export CSV</button>
                    </div>
                </div>

                <div id="notes-list" class="notes-list">
                    <p class="empty-state">No notes yet. Start typing while watching to add notes.</p>
                </div>
            </section>
        </main>

        <footer>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
